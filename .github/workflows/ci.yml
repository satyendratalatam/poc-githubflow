name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build and test
        run: mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-order-service-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Print JAR size
        run: |
          ls -lh target/*.jar | awk '{print "JAR size: " $5 " " $9}'

